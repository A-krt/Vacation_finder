name: Vacation Finder Daily Search

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC = 10:00 Amsterdam during summer time (July/August)
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: vacation-finder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest

      - name: Run browser smoke check
        run: python playwright_smoke.py

      - name: Run vacation search
        run: python run.py

      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacation-results
          path: output/results/*.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots and probe metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            output/screenshots/*.png
            output/screenshots/*.json
          if-no-files-found: warn
          retention-days: 14
