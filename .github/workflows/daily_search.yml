name: Vacation Finder Seasonal Shortlist

on:
  workflow_dispatch:
    inputs:
      output_label:
        description: "Label for this run"
        required: true
        default: "august_live_2026"
      total_budget:
        description: "Total budget in EUR"
        required: true
        default: "1500"
      departure_airport:
        description: "Departure airport code"
        required: true
        default: "AMS"
      adults:
        description: "Number of adults"
        required: true
        default: "2"
      top_shortlist_n:
        description: "Shortlist size"
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: vacation-finder-seasonal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seasonal-shortlist:
    runs-on: ubuntu-latest

    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

      OUTPUT_LABEL: ${{ inputs.output_label }}
      TOTAL_BUDGET: ${{ inputs.total_budget }}
      DEPARTURE_AIRPORT: ${{ inputs.departure_airport }}
      ADULTS: ${{ inputs.adults }}
      TOP_SHORTLIST_N: ${{ inputs.top_shortlist_n }}

      ALLOWED_MONTHS: "2026-08"
      NIGHTS_OPTIONS: "10"
      DESTINATION_FILTERS: "AYT,ALC,VLC"

      USE_LIVE_STAY_SCRAPERS: "true"
      USE_LIVE_FLIGHT_SOURCES: "true"

      CHECKED_BAG_FEE_ESTIMATE_TOTAL: "70"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run seasonal shortlist search
        run: python run.py

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-full-results
          path: output/results/*.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-shortlist
          path: output/shortlists/*.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification links
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-verification-links
          path: output/verification/*.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload provider audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-provider-audits
          path: output/audit/*.json
          if-no-files-found: warn
          retention-days: 14
